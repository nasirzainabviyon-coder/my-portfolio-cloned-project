<body>
  <header class="top-header">
    <div class="brand-area">
      <div class="brand-logo">
        <img src="sudaylogo.svg" alt="Laundry logo" />
      </div>

      <div class="brand-info">
        <h2>Sunday's Laundry Spot</h2>
        <p>CLEANER CLOTHES, BETTER LIVING</p>
      </div>
    </div>

    <nav class="navigation" id="header-navigation" aria-label="menu navigation">
      <a href="#services">Services</a>
      <a href="#prices">Prices</a>
      <a href="#">How it works</a>
      <a href="#">Questions</a>
      <a href="#">Complaints</a>
    </nav>

    <div class="header-options">
      <button class="install-btn">
        <i data-lucide="download"></i>

        <span>
          Install
          <br />
          app
        </span>
      </button>

      <div class="language-area">
        <i class="fa-solid fa-language"></i>

        <button class="active-language">English</button>
        <button>Pidgin</button>
      </div>

      <a href="#" class="login-link">Log in</a>
      <button class="pickup-btn">Book a pickup</button>
    </div>

    <button
      class="menu-toggle"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="header-navigation"
    >
      <i class="fa-solid fa-bars"></i>
    </button>
  </header>
</body>
